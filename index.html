<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerAI - Instant Launcher & Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; max-width: 540px; width: 100%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .logo { width: 64px; height: 64px; background: linear-gradient(135deg, #3b82f6, #6366f1); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color: #fff; margin: 0 auto 20px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 28px; border-radius: 10px; font-size: 16px; font-weight: 700; text-decoration: none; transition: all 0.2s ease; cursor: pointer; width: 100%; margin-bottom: 12px; border: none; }
    .btn-primary { background-color: #3b82f6; color: #fff; }
    .btn-primary:hover { background-color: #2563eb; transform: translateY(-2px); }
    .btn-outline { background-color: transparent; border: 1px solid #334155; color: #cbd5e1; }
    .btn-outline:hover { background-color: #334155; color: #fff; }
    .status-box { background: #0f172a; border: 1px solid #334155; padding: 14px; border-radius: 8px; font-size: 13px; color: #94a3b8; margin-top: 20px; display: flex; align-items: center; justify-content: space-between; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #10b981; display: inline-block; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">C</div>
    <h1>CareerAI System</h1>
    <p>Personalized Career Recommendation & Student Performance Analysis System</p>

    <a href="http://localhost:5173" id="appLink" className="btn btn-primary" style="background-color: #3b82f6; color: #fff;" class="btn btn-primary">
      🚀 Open CareerAI Web Application
    </a>

    <a href="http://127.0.0.1:8000/docs" target="_blank" class="btn btn-outline">
      ⚙️ Open FastAPI Documentation
    </a>

    <div class="status-box">
      <div><span class="status-dot" id="statusDot"></span> Live Servers Status</div>
      <span id="statusText" style="color: #38bdf8; font-weight: 600;">Online (Port 5173 / 8000)</span>
    </div>
  </div>

  <script>
    // Auto redirect to http://localhost:5173 after checking connection
    fetch('http://127.0.0.1:8000/')
      .then(res => res.json())
      .then(data => {
        document.getElementById('statusText').innerText = "Online & Connected";
        // Uncomment below line if automatic instant redirection is desired:
        // window.location.href = "http://localhost:5173";
      })
      .catch(err => {
        document.getElementById('statusDot').style.backgroundColor = '#f59e0b';
        document.getElementById('statusText').innerText = "Connecting...";
      });
  </script>
</body>
</html>
